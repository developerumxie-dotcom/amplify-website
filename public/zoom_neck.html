<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Neck Comparison</title>
  <style>
    body { margin: 0; background: #070514; color: #fff; font-family: sans-serif; padding: 20px; }
    .row { display: flex; gap: 20px; margin-bottom: 20px; }
    .box { flex: 1; background: #0f0a2e; border: 1px solid #332b55; border-radius: 8px; overflow: hidden; }
    h2 { margin: 0; padding: 10px 16px; font-size: 14px; background: rgba(255,255,255,0.06); }
    .img-wrap { position: relative; width: 500px; height: 400px; overflow: hidden; }
    .img-wrap img { position: absolute; }
  </style>
</head>
<body>
  <div class="row">
    <!-- Image 1 Zoomed to Neck & Head -->
    <div class="box">
      <h2 style="color: #38bdf8;">IMAGE 1 (ORIGINAL REFERENCE) — NECK & HEAD ZOOM</h2>
      <div class="img-wrap">
        <!-- Scale and position focused on neck/head: x in [450, 850], y in [180, 500] -->
        <img src="/user_ref_img1.jpg" style="left: -480px; top: -180px; width: 1024px; height: 682px;" />
      </div>
    </div>

    <!-- Image 2 Zoomed to Neck & Head -->
    <div class="box">
      <h2 style="color: #f43f5e;">IMAGE 2 (CURRENT WEBSITE RENDER) — NECK & HEAD ZOOM</h2>
      <div class="img-wrap">
        <!-- In 1024x575 screenshot, the bird is on the right side: x ~ 550..950, y ~ 100..400 -->
        <img src="/user_curr_img2.jpg" style="left: -580px; top: -120px; width: 1024px; height: 575px;" />
      </div>
    </div>
  </div>
</body>
</html>
